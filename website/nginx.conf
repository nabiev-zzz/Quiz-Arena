server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve every app document and JavaScript bundle as UTF-8. Without this,
    # Uzbek apostrophes and Unicode status symbols can be decoded as mojibake.
    charset utf-8;
    charset_types text/html text/css text/plain application/javascript text/javascript application/json application/manifest+json;

    location = /app {
        return 301 /app/;
    }

    # Always fetch the current app shell so deployments cannot be hidden by a stale HTML cache.
    location = /app/index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location /app/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /app/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Expo exports fingerprinted assets; they can be cached safely.
    location ~* \.(css|js|png|jpg|jpeg|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
