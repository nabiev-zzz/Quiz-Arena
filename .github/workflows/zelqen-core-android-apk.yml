name: ZELQEN CORE Android APK
# Trigger the release APK workflow when a verified feature release is merged to main.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/zelqen-core-android-apk.yml'

permissions:
  contents: read

concurrency:
  group: zelqen-core-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Read app version
        id: app
        run: |
          node -e "const a=require('./app.json').expo; console.log('version='+a.version); console.log('version_code='+a.android.versionCode); console.log('app_name='+a.name)" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZELQEN-CORE-v${{ steps.app.outputs.version }}-(${{ steps.app.outputs.version_code }})-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
