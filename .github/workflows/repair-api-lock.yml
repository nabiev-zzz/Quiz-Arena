name: Repair API npm lockfile

on:
  push:
    branches: [fix/api-no-cache]
    paths:
      - "apps/api/api/LOCKFILE_REPAIR_TRIGGER.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/api-no-cache
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/api/api/package-lock.json
      - name: Regenerate lockfile
        working-directory: apps/api/api
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate clean install and build
        working-directory: apps/api/api
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm test -- --runInBand src/learning/document-quiz/document-extraction.service.spec.ts src/learning/learning.service.spec.ts src/learning/learning.queue-payload.spec.ts src/users/community-learning.service.spec.ts
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- apps/api/api/package-lock.json; then
            echo "Lockfile already valid; no update needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/api/package-lock.json
          git commit -m "fix(api): regenerate corrupted npm lockfile"
          git push
