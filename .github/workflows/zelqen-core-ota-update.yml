name: ZELQEN CORE OTA Update

on:
  push:
    branches:
      - main
    paths:
      - 'App.tsx'
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - 'src/**/*.js'
      - 'src/**/*.jsx'
      - '!src/**/*.test.*'
      - '!src/**/__tests__/**'
      - '!src/**/*.spec.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zelqen-core-ota-production
  cancel-in-progress: true

jobs:
  publish-ota:
    name: Publish production OTA update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish OTA update to production channel
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing GitHub Actions secret EXPO_TOKEN. Add an Expo access token at Settings > Secrets and variables > Actions."
            exit 1
          fi
          npx eas-cli update --channel production --message "main ${GITHUB_SHA::7}" --non-interactive
