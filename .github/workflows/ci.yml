name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**', 'fix/**']

permissions:
  contents: read

jobs:
  mobile:
    name: Mobile app validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Expo Doctor
        run: npx expo-doctor
      - name: Expo dependency validation
        run: npx expo install --check
      - name: Android JavaScript bundle validation
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/expo-android-export"

  api:
    name: API build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build API
        run: npm run build
      - name: API lint
        run: npm run lint
      - name: API unit tests
        run: npm test -- --runInBand
