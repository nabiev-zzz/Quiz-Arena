name: Mobile app validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/liquid-glass-dock
      - feat/education-statistics-dashboard

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript validation
        run: npx tsc --noEmit -p tsconfig.json

      - name: Expo dependency validation
        run: npx expo install --check

  validate-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/api/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Build NestJS API
        run: npm run build

      - name: Test payment security, plan entitlements, AI Tutor quotas, document quiz and private Battle
        run: npm test -- --runInBand src/subscriptions/subscription-payments.service.spec.ts src/subscriptions/plan-entitlements.spec.ts src/subscriptions/feature-usage.service.spec.ts src/learning/learning.service.spec.ts src/battle/gateway/battle.gateway.spec.ts src/battle/redis-io.adapter.spec.ts src/ai/ai-tutor.service.spec.ts
