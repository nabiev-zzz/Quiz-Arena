name: Mobile app validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/liquid-glass-dock
      - feat/education-statistics-dashboard
      - feat/free-web-app-launch

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Synchronize npm lockfile for Expo Updates
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript validation
        run: npx tsc --noEmit -p tsconfig.json

      - name: Export browser-ready web app
        run: npx expo export --platform web --output-dir "$RUNNER_TEMP/expo-web-export"

      - name: Export native Android app bundle
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/expo-android-export"

      - name: Export native iOS app bundle
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/expo-ios-export"

      - name: Validate mobile release and EAS Update configuration
        run: |
          node - <<'NODE'
          const app = require('./app.json').expo;
          const eas = require('./eas.json');
          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };
          assert(app.android?.package === 'uz.quizarena.app', 'Android package is missing');
          assert(app.ios?.bundleIdentifier === 'uz.quizarena.app', 'iOS bundle identifier is missing');
          assert(app.updates?.url === `https://u.expo.dev/${app.extra?.eas?.projectId}`, 'EAS Update URL/project ID mismatch');
          assert(app.runtimeVersion?.policy === 'appVersion', 'runtimeVersion appVersion policy is required');
          assert(require('./package.json').dependencies?.['expo-updates'], 'expo-updates dependency is missing');
          assert(eas.build?.preview?.distribution === 'internal', 'preview must use internal distribution');
          assert(eas.build?.preview?.channel === 'preview', 'preview channel is missing');
          assert(eas.build?.preview?.android?.buildType === 'apk', 'preview Android build must be an APK');
          assert(eas.build?.production?.channel === 'production', 'production channel is missing');
          assert(eas.build?.production?.android?.buildType === 'app-bundle', 'production Android build must be an AAB');
          console.log('Mobile release configuration is valid.');
          NODE

      - name: Build the combined public website image
        run: docker build --build-arg APP_SOURCE_BRANCH=main -t quiz-arena-website:ci -f website/Dockerfile website

      - name: Smoke-test landing page and browser app routes
        run: |
          docker run -d --name quiz-arena-web-smoke -p 8080:8080 quiz-arena-website:ci
          trap 'docker rm -f quiz-arena-web-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --dump-header "$RUNNER_TEMP/landing.headers" http://127.0.0.1:8080/ > "$RUNNER_TEMP/landing.html"; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --dump-header "$RUNNER_TEMP/app.headers" http://127.0.0.1:8080/app/ > "$RUNNER_TEMP/app.html"
          grep -qi "content-type: text/html; charset=utf-8" "$RUNNER_TEMP/landing.headers"
          grep -qi "content-type: text/html; charset=utf-8" "$RUNNER_TEMP/app.headers"
          grep -q "QUIZ ARENA" "$RUNNER_TEMP/landing.html"
          grep -q "/app/_expo/" "$RUNNER_TEMP/app.html"

      - name: Expo dependency validation
        run: npx expo install --check

      - name: Validate Samsung Galaxy Store build profile and policy settings
        run: |
          GALAXY_STORE_BUILD=true npx expo config --type public --json > "$RUNNER_TEMP/galaxy-store-expo-config.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const eas = require('./eas.json');
          const config = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/galaxy-store-expo-config.json', 'utf8'));
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          assert(eas.build?.galaxyStore?.distribution === 'store', 'Galaxy Store profile must use store distribution');
          assert(eas.build?.galaxyStore?.android?.buildType === 'app-bundle', 'Galaxy Store profile must build an AAB');
          assert(config.extra?.distributionStore === 'galaxy-store', 'Galaxy Store build flag is missing');
          assert(config.updates?.enabled === false, 'Galaxy Store builds must not enable automatic app updates');
          assert(config.updates?.checkAutomatically === 'NEVER', 'Galaxy Store updates must not be checked automatically');
          console.log('Galaxy Store configuration is valid.');
          NODE

      - name: Export Galaxy Store Android bundle
        run: GALAXY_STORE_BUILD=true npx expo export --platform android --output-dir "$RUNNER_TEMP/galaxy-store-android-export"

      - name: Commit synchronized mobile lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/mobile-release-eas-updates' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize Expo Updates lockfile"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

  validate-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/api/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Build NestJS API
        run: npm run build

      - name: Test payment security, Battle rank and history
        run: npm test -- --runInBand src/subscriptions/subscription-payments.service.spec.ts src/battle/battle.service.spec.ts
