name: Mobile app validation

on:
  pull_request:
    branches:
      - main
      - feat/premium-entitlements-feature-roadmap
  push:
    branches:
      - feature/liquid-glass-dock
      - feat/education-statistics-dashboard
      - feat/free-web-app-launch

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript validation
        run: npx tsc --noEmit -p tsconfig.json

      - name: Export browser-ready web app
        run: npx expo export --platform web --output-dir "$RUNNER_TEMP/expo-web-export"

      - name: Build the combined public website image
        run: docker build -t quiz-arena-website:ci -f website/Dockerfile .

      - name: Smoke-test landing page and browser app routes
        run: |
          docker run -d --name quiz-arena-web-smoke -p 8080:8080 quiz-arena-website:ci
          trap 'docker rm -f quiz-arena-web-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --dump-header "$RUNNER_TEMP/landing.headers" http://127.0.0.1:8080/ > "$RUNNER_TEMP/landing.html"; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --dump-header "$RUNNER_TEMP/app.headers" http://127.0.0.1:8080/app/ > "$RUNNER_TEMP/app.html"
          grep -qi "content-type: text/html; charset=utf-8" "$RUNNER_TEMP/landing.headers"
          grep -qi "content-type: text/html; charset=utf-8" "$RUNNER_TEMP/app.headers"
          grep -q "ZELQEN CORE" "$RUNNER_TEMP/landing.html"
          grep -q "<title>ZELQEN CORE</title>" "$RUNNER_TEMP/app.html"
          grep -q "/app/_expo/" "$RUNNER_TEMP/app.html"

      - name: Expo dependency validation
        run: npx expo install --check

  validate-api:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      VALKEY_HOST: 127.0.0.1
      VALKEY_PORT: 6379
      BATTLE_REDIS_PREFIX: quiz-arena:ci
      BATTLE_SHARED_STATE_REQUIRED: 'true'
    defaults:
      run:
        working-directory: apps/api/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/api/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Build NestJS API
        run: npm run build

      - name: Validate Railway process supervisor
        run: node --check start-api-with-ai-worker.cjs

      - name: Test payment security, plan entitlements, AI Tutor quotas, document quiz and private Battle
        run: npm test -- --runInBand src/subscriptions/subscription-payments.service.spec.ts src/subscriptions/plan-entitlements.spec.ts src/subscriptions/feature-usage.service.spec.ts src/learning/learning.service.spec.ts src/battle/gateway/battle.gateway.spec.ts src/battle/redis-io.adapter.spec.ts src/battle/battle-state.store.spec.ts src/ai/ai-tutor.service.spec.ts src/ai/queue/ai-generation-queue.service.spec.ts src/ai/queue/ai-generation.queue.integration.spec.ts src/battle/battle.service.spec.ts
